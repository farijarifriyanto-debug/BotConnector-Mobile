workflows:
  ios-simulator-smoke:
    name: BotConnector iOS Simulator Smoke
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        XCODE_WORKSPACE: ios/PocketPal.xcworkspace
        XCODE_SCHEME: PocketPal
      node: 22.21.0
      ruby: 3.2.3
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods
        - $CM_BUILD_DIR/node_modules
        - $CM_BUILD_DIR/vendor/bundle

    scripts:
      - name: Release preflight
        script: |
          bash scripts/release-preflight.sh

      - name: Install JavaScript dependencies
        script: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Install Ruby and CocoaPods dependencies
        script: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
          cd ios
          bundle exec pod install

      - name: Create unsigned CI placeholders
        script: |
          cat > ios/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CLIENT_ID</key><string>ci-placeholder.apps.googleusercontent.com</string>
          <key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.ci-placeholder</string>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>API_KEY</key><string>ci-placeholder</string>
          <key>PROJECT_ID</key><string>botconnector-ci</string>
          <key>BUNDLE_ID</key><string>id.botconnector.app</string>
          </dict></plist>
          PLIST

          cat > ios/Config/Env.xcconfig <<'EOF'
          GOOGLE_WEB_CLIENT_ID = ci-placeholder.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.ci-placeholder
          EOF

      - name: Build unsigned iOS simulator app
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  macos-catalyst-smoke:
    name: BotConnector macOS Catalyst Smoke
    instance_type: mac_mini_m2
    max_build_duration: 90

    environment:
      vars:
        XCODE_WORKSPACE: ios/PocketPal.xcworkspace
        XCODE_SCHEME: PocketPal
        BOTCONNECTOR_MAC_CATALYST: "1"
      node: 22.21.0
      ruby: 3.2.3
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods
        - $CM_BUILD_DIR/node_modules
        - $CM_BUILD_DIR/vendor/bundle

    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Install Ruby and CocoaPods dependencies
        script: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
          cd ios
          bundle exec pod install

      - name: Create unsigned CI placeholders
        script: |
          cat > ios/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CLIENT_ID</key><string>ci-placeholder.apps.googleusercontent.com</string>
          <key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.ci-placeholder</string>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>API_KEY</key><string>ci-placeholder</string>
          <key>PROJECT_ID</key><string>botconnector-ci</string>
          <key>BUNDLE_ID</key><string>id.botconnector.app</string>
          </dict></plist>
          PLIST
          cat > ios/Config/Env.xcconfig <<'EOF'
          GOOGLE_WEB_CLIENT_ID = ci-placeholder.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.ci-placeholder
          EOF

      - name: Build unsigned Mac Catalyst app
        script: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          export EXTRA_PACKAGER_ARGS="--max-workers 2"
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath build/macos-catalyst \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Launch and capture Mac render
        script: |
          set -euo pipefail
          APP="$(find build/macos-catalyst/Build/Products/Debug-maccatalyst -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p build/macos-catalyst-render
          codesign --force --deep --sign - "$APP"
          open -n "$APP"
          sleep 10
          EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          pgrep -f "/$EXEC$" >/dev/null
          osascript -e "tell application \"System Events\" to tell process \"$EXEC\" to set frontmost to true" || true
          sleep 2
          screencapture -x build/macos-catalyst-render/botconnector-mac.png || true
          pkill -f "/$EXEC$" || true

    artifacts:
      - build/macos-catalyst/Build/Products/Debug-maccatalyst/*.app
      - build/macos-catalyst-render/*.png
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: BotConnector iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "BotConnector Codemagic"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: id.botconnector.app
      vars:
        BUNDLE_ID: id.botconnector.app
        APP_STORE_APPLE_ID: "6819144928"
        XCODE_WORKSPACE: ios/PocketPal.xcworkspace
        XCODE_SCHEME: PocketPal
      node: 22.21.0
      ruby: 3.2.3
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods
        - $CM_BUILD_DIR/node_modules
        - $CM_BUILD_DIR/vendor/bundle

    scripts:
      - name: Release preflight
        script: |
          bash scripts/release-preflight.sh

      - name: Install JavaScript dependencies
        script: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Install Ruby and CocoaPods dependencies
        script: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
          cd ios
          bundle exec pod install

      - name: Create iOS environment files
        script: |
          if [ -n "${GOOGLE_SERVICES_PLIST_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_PLIST_B64" | base64 --decode > ios/GoogleService-Info.plist
            GOOGLE_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" ios/GoogleService-Info.plist)
            [ "$GOOGLE_BUNDLE_ID" = "$BUNDLE_ID" ] || {
              echo "GoogleService-Info.plist BUNDLE_ID mismatch: $GOOGLE_BUNDLE_ID" >&2
              exit 1
            }
            echo "Using production Google/Firebase configuration"
          else
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '<key>CLIENT_ID</key><string>ci-placeholder.apps.googleusercontent.com</string>' \
              '<key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.ci-placeholder</string>' \
              '<key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>' \
              '<key>GCM_SENDER_ID</key><string>000000000000</string>' \
              '<key>API_KEY</key><string>ci-placeholder</string>' \
              '<key>PROJECT_ID</key><string>botconnector-ci</string>' \
              '<key>BUNDLE_ID</key><string>id.botconnector.app</string>' \
              '</dict></plist>' \
              > ios/GoogleService-Info.plist
            echo "Firebase/PalsHub integrations disabled: no production Google config supplied"
          fi

          REVERSED_GOOGLE_IOS_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/GoogleService-Info.plist)
          GOOGLE_WEB_CLIENT_ID_VALUE="${GOOGLE_WEB_CLIENT_ID:-ci-placeholder.apps.googleusercontent.com}"

          printf '%s\n' \
            "GOOGLE_WEB_CLIENT_ID = $GOOGLE_WEB_CLIENT_ID_VALUE" \
            "REVERSED_GOOGLE_IOS_CLIENT_ID = $REVERSED_GOOGLE_IOS_CLIENT_ID" \
            > ios/Config/Env.xcconfig

      - name: Set up App Store code signing
        script: |
          if ! ruby -e 'require "xcodeproj"' >/dev/null 2>&1; then
            gem install xcodeproj -v 1.25.1 --no-document
          fi
          if ! ruby -e 'gem "xcpretty", "0.4.1"' >/dev/null 2>&1; then
            gem install xcpretty -v 0.4.1 --no-document
          fi
          if command -v rbenv >/dev/null 2>&1; then
            rbenv rehash
          fi
          ruby -e 'require "xcodeproj"; puts "xcodeproj #{Xcodeproj::VERSION}"'
          ruby -e 'gem "xcpretty", "0.4.1"; puts "xcpretty gem 0.4.1 ready"'
          xcpretty --version
          xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd ios
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          export EXTRA_PACKAGER_ARGS="--max-workers 2"
          node -e 'console.log("Node heap limit configured:", process.env.NODE_OPTIONS)'
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
