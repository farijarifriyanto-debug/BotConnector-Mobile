workflows:
  ios-simulator-smoke:
    name: BotConnector iOS Simulator Smoke
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        XCODE_WORKSPACE: ios/PocketPal.xcworkspace
        XCODE_SCHEME: PocketPal
      node: 22.21.0
      ruby: 3.2.3
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods
        - $CM_BUILD_DIR/node_modules
        - $CM_BUILD_DIR/vendor/bundle

    scripts:
      - name: Release preflight
        script: |
          bash scripts/release-preflight.sh

      - name: Install JavaScript dependencies
        script: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Install Ruby and CocoaPods dependencies
        script: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
          cd ios
          bundle exec pod install

      - name: Create unsigned CI placeholders
        script: |
          cat > ios/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CLIENT_ID</key><string>ci-placeholder.apps.googleusercontent.com</string>
          <key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.ci-placeholder</string>
          <key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>
          <key>GCM_SENDER_ID</key><string>000000000000</string>
          <key>API_KEY</key><string>ci-placeholder</string>
          <key>PROJECT_ID</key><string>botconnector-ci</string>
          <key>BUNDLE_ID</key><string>id.botconnector.app</string>
          </dict></plist>
          PLIST

          cat > ios/Config/Env.xcconfig <<'EOF'
          GOOGLE_WEB_CLIENT_ID = ci-placeholder.apps.googleusercontent.com
          REVERSED_GOOGLE_IOS_CLIENT_ID = com.googleusercontent.apps.ci-placeholder
          EOF

      - name: Build unsigned iOS simulator app
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

    artifacts:
      - build/ios-simulator/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: BotConnector iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    integrations:
      app_store_connect: "BotConnector Codemagic"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: id.botconnector.app
      vars:
        BUNDLE_ID: id.botconnector.app
        APP_STORE_APPLE_ID: "6819144928"
        XCODE_WORKSPACE: ios/PocketPal.xcworkspace
        XCODE_SCHEME: PocketPal
      node: 22.21.0
      ruby: 3.2.3
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods
        - $CM_BUILD_DIR/node_modules
        - $CM_BUILD_DIR/vendor/bundle

    scripts:
      - name: Release preflight
        script: |
          bash scripts/release-preflight.sh

      - name: Install JavaScript dependencies
        script: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Install Ruby and CocoaPods dependencies
        script: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
          cd ios
          bundle exec pod install

      - name: Create iOS environment files
        script: |
          if [ -n "${GOOGLE_SERVICES_PLIST_B64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_PLIST_B64" | base64 --decode > ios/GoogleService-Info.plist
          else
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0"><dict>' \
              '<key>CLIENT_ID</key><string>ci-placeholder.apps.googleusercontent.com</string>' \
              '<key>REVERSED_CLIENT_ID</key><string>com.googleusercontent.apps.ci-placeholder</string>' \
              '<key>GOOGLE_APP_ID</key><string>1:000000000000:ios:0000000000000000</string>' \
              '<key>GCM_SENDER_ID</key><string>000000000000</string>' \
              '<key>API_KEY</key><string>ci-placeholder</string>' \
              '<key>PROJECT_ID</key><string>botconnector-ci</string>' \
              '<key>BUNDLE_ID</key><string>id.botconnector.app</string>' \
              '</dict></plist>' \
              > ios/GoogleService-Info.plist
          fi

          REVERSED_GOOGLE_IOS_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/GoogleService-Info.plist)
          GOOGLE_WEB_CLIENT_ID_VALUE="${GOOGLE_WEB_CLIENT_ID:-ci-placeholder.apps.googleusercontent.com}"

          printf '%s\n' \
            "GOOGLE_WEB_CLIENT_ID = $GOOGLE_WEB_CLIENT_ID_VALUE" \
            "REVERSED_GOOGLE_IOS_CLIENT_ID = $REVERSED_GOOGLE_IOS_CLIENT_ID" \
            > ios/Config/Env.xcconfig

      - name: Set up App Store code signing
        script: |
          if ! ruby -e 'require "xcodeproj"' >/dev/null 2>&1; then
            gem install xcodeproj -v 1.25.1 --no-document
          fi
          ruby -e 'require "xcodeproj"; puts "xcodeproj #{Xcodeproj::VERSION}"'
          xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd ios
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
