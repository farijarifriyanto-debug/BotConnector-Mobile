workflows:
  android-debug:
    name: BotConnector Android Debug
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 24.18.0
      java: 17
      vars:
        PACKAGE_NAME: "id.botconnector.app"
    scripts:
      - name: Install JavaScript dependencies
        script: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Build production-flavor debug APK
        script: |
          cd android
          ./gradlew assembleProdDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/logs/**/*.txt

  ios-unsigned:
    name: BotConnector iOS Unsigned Compile
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 24.18.0
      ruby: 3.2.3
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "id.botconnector.app"
        XCODE_WORKSPACE: "PocketPal.xcworkspace"
        XCODE_SCHEME: "PocketPal"
    scripts:
      - name: Install JavaScript dependencies
        script: |
          corepack enable
          yarn install --frozen-lockfile
      - name: Install Ruby dependencies
        script: |
          bundle install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          bundle exec pod install
      - name: Compile iOS without code signing
        script: |
          xcodebuild \
            -workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
