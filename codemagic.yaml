workflows:
  ios-testflight:
    name: BotConnector iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      groups:
        - botconnector_ios
      vars:
        BUNDLE_ID: id.botconnector.app
        XCODE_WORKSPACE: ios/PocketPal.xcworkspace
        XCODE_SCHEME: PocketPal
      node: 22.21.0
      ruby: 3.2.3
      xcode: latest

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.cocoapods
        - $CM_BUILD_DIR/node_modules
        - $CM_BUILD_DIR/vendor/bundle

    scripts:
      - name: Release preflight
        script: |
          bash scripts/release-preflight.sh

      - name: Install JavaScript dependencies
        script: |
          npm install --global yarn@1.22.22
          yarn install --frozen-lockfile

      - name: Install Ruby and CocoaPods dependencies
        script: |
          bundle config set path vendor/bundle
          bundle install --jobs 4 --retry 3
          cd ios
          bundle exec pod install

      - name: Create iOS environment files
        script: |
          : "${GOOGLE_SERVICES_PLIST_B64:?Set GOOGLE_SERVICES_PLIST_B64 in Codemagic group botconnector_ios}"
          : "${GOOGLE_WEB_CLIENT_ID:?Set GOOGLE_WEB_CLIENT_ID in Codemagic group botconnector_ios}"

          printf '%s' "$GOOGLE_SERVICES_PLIST_B64" | base64 --decode > ios/GoogleService-Info.plist
          REVERSED_GOOGLE_IOS_CLIENT_ID=$(/usr/libexec/PlistBuddy -c "Print :REVERSED_CLIENT_ID" ios/GoogleService-Info.plist)

          cat > ios/Config/Env.xcconfig <<EOF
          GOOGLE_WEB_CLIENT_ID = $GOOGLE_WEB_CLIENT_ID
          REVERSED_GOOGLE_IOS_CLIENT_ID = $REVERSED_GOOGLE_IOS_CLIENT_ID
          EOF

      - name: Fetch App Store signing files
        script: |
          : "${APP_STORE_CONNECT_ISSUER_ID:?Missing APP_STORE_CONNECT_ISSUER_ID}"
          : "${APP_STORE_CONNECT_KEY_IDENTIFIER:?Missing APP_STORE_CONNECT_KEY_IDENTIFIER}"
          : "${APP_STORE_CONNECT_PRIVATE_KEY:?Missing APP_STORE_CONNECT_PRIVATE_KEY}"

          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Set iOS build number
        script: |
          cd ios
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
