name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Build variant (prodRelease or prodDebug)'
        required: true
        default: 'prodRelease'
        type: choice
        options:
          - 'prodRelease'
          - 'prodDebug'
  push:
    branches:
      - 'release/android-build-2'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'ios/**'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (${{ inputs.build_variant || 'prodRelease' }})
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_rnllamaBuildFromSource: 'true'
      RNLLAMA_SKIP_POSTINSTALL: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maximize build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          df -h /

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install

      - name: Derive the rnllama variant allowlist from the payload manifest
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          echo "Declared allowlist: $VARIANTS"
          echo "ORG_GRADLE_PROJECT_rnllamaVariants=$VARIANTS" >> "$GITHUB_ENV"

      - name: Cache llama.rn native build tree
        uses: actions/cache@v4
        with:
          path: node_modules/llama.rn/android/.cxx
          key: ${{ runner.os }}-cxx-${{ hashFiles('yarn.lock', 'scripts/android-payload-manifest.json') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up the Hexagon SDK
        uses: ./.github/actions/setup-hexagon-sdk

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache

      - name: Create dummy google-services.json for CI
        run: |
          cat > android/app/google-services.json << 'EOL'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "botconnector-ci",
              "storage_bucket": "botconnector-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "id.botconnector.app"
                  }
                },
                "api_key": [{
                  "current_key": "ci-placeholder-api-key"
                }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111",
                  "android_client_info": {
                    "package_name": "id.botconnector.app.e2e"
                  }
                },
                "api_key": [{
                  "current_key": "ci-placeholder-api-key"
                }]
              }
            ]
          }
          EOL

      - name: Create dummy .env file for CI
        run: |
          cat > .env << 'EOL'
          APP_URL=botconnector://app
          ENABLE_PALSHUB_INTEGRATION=true
          ENABLE_AUTHENTICATION=true
          ENABLE_OFFLINE_MODE=true
          EOL

      - name: Create dummy release keystore for CI
        working-directory: android/app
        run: |
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore pocketpal-release-key.keystore \
            -alias pocketpal_key_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dummy-ci-password \
            -keypass dummy-ci-password \
            -dname "CN=BotConnector CI, OU=CI, O=BotConnector, L=CI, S=CI, C=ID"

      - name: Build Android APK
        working-directory: android
        env:
          APP_RELEASE_STORE_PASSWORD: dummy-ci-password
          APP_RELEASE_KEY_PASSWORD: dummy-ci-password
        run: |
          set -euo pipefail
          VARIANT="${{ inputs.build_variant || 'prodRelease' }}"
          echo "Target variant: $VARIANT"
          if [ "$VARIANT" = "prodDebug" ]; then
            ./gradlew assembleProdDebug 2>&1 | tee android-build.log
          else
            ./gradlew assembleProdRelease 2>&1 | tee android-build.log
          fi

      - name: ccache statistics
        if: always()
        run: ccache --show-stats || echo "ccache unavailable"

      - name: Verify variant allowlist reached llama.rn
        run: |
          set -euo pipefail
          VARIANTS=$(node scripts/verify-android-payload.js --print-variants)
          if ! grep -qF "Building rnllama variants: $VARIANTS" android/android-build.log; then
            echo "::warning::llama.rn variants check warning"
          else
            echo "OK: llama.rn reported the declared variant list."
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: botconnector-android-apk
          path: |
            android/app/build/outputs/apk/prod/*/*.apk
          retention-days: 30
